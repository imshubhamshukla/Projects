<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora</title>
    <!-- fontawesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
}

/* special classes */
.flex-center {
    display: flex;
    justify-content: center;
    align-items: center;
}

body {
    background-image: url('phoneBack.png');
    background-repeat: no-repeat;
    background-size: 100%;
    background-position: top;
}


nav {
    background: transparent;
    height: 12vh;
    justify-content: space-around !important;
}

.fa-circle-xmark {
    display: none;
}


.logo img {
    width: 3vw;
    margin: 0px 5px;
}

.logo h1 {
    font-size: 1.4em;
    color: white;
}

.linkTab a {
    text-shadow: 1px 1px 1px black;
    border-radius: 10px;
    font-size: 1.2em;
    font-family: sans-serif;
    color: white;
    font-weight: 600;
    text-decoration: none;
    margin: 0px 2vw;
    padding: 1vh 0px;
}

.orderBtn button {
    background: linear-gradient(to right, #050816, #0D1023);
    border: none;
    padding: 1vh 1vw;
    font-size: 0.9em;
    font-family: cursive;
    border-radius: 10px;
    font-weight: 500;
    color: white;
}

.fa-bars {
    display: none;
}

main {
    height: 88vh;
}

main section {
    width: 40vw;
    height: 88vh;
    /* background-color: blue; */
    padding: 8vh 0px 0px 10vw;
}

.launchLogo {
    border: 1px solid grey;
    border-radius: 40px;
    color: rgb(0, 81, 81);
    padding: 1vh 1vw;
    background: transparent;
    font-size: 0.8em;
    font-weight: 800;
    font-family: cursive;
}

.phoneHeading {
    margin: 1vh 0px;
    color: white;
    font-size: 3.5em;
    text-shadow: 2px 2px 2px black;
    font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
}

.phoneDetail {
    margin: 2vh 0px;
    font-size: 1.2em;
    color: yellow;
    font-family: Arial, Helvetica, sans-serif;
}

.price {
    padding: 1vh 1vw;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
}

.price p {
    color: red;
    font-size: 1.2em;
    font-family: Verdana, Geneva, Tahoma, sans-serif;
}

.price h1 {
    font-size: 3em;
    background: linear-gradient(to right, rgb(68, 39, 135), rgb(56, 27, 112), rgb(38, 36, 142), rgb(30, 35, 121));
    color: transparent;
    background-clip: text;
}

.orderButtons button {
    font-size: 1em;
    font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
    border-radius: 10px;
    margin: 4vh 1vw;
    border: 1px solid black;
    padding: 1vh 1vw;
    font-weight: 700;
    background: linear-gradient(to right, rgb(15, 0, 59), rgb(7, 0, 106));
    color: white;
}

#videoBtn {
    border: none;
    color: black;
    background: none;
}

.fa-circle-play {
    color: green;
}

.phoneInfo {
    border-left: 2px solid white;
    border-right: 2px solid white;
    width: 8vw;
    height: 7vh;
    display: flex;
    justify-content: space-around;
    align-items: center;
}

.phoneInfo i {
    color: aquamarine;
    font-size: 1.1em;
}

.phoneInfo div h3 {
    text-shadow: 0.8px 0.8px 1px blue;
    color: white;
    font-size: 0.8em;
    font-family: Verdana, Geneva, Tahoma, sans-serif;
    margin: 1vh 0px;
}

.phoneInfo div h4 {
    margin: 1vh 0px;
    text-shadow: 0.8px 0.8px 1px blue;
    color: white;
    font-size: 0.8em;
    font-family: cursive;
}

#phoneFeature {
    padding: 1vh 2vw;
    background: linear-gradient(to right, rgb(25, 25, 25), rgb(41, 41, 41));
    display: flex;
    justify-content: space-around;
    align-items: center;
    border-radius: 10px;
}

.menuBars{
    display: none;
}













/* hover effects */
.linkTab a:hover {
    border-bottom: 5px solid royalblue;
}

.orderBtn button:hover {
    cursor: pointer;
    color: yellow;
}

.orderButtons button:hover {
    cursor: pointer;
    background: green;
}

#videoBtn:hover {
    border: 1px solid black;
}






@media(max-width:600px) {

    .menuBars{
        display: block;
    }

    .linkTab,
    .orderBtn {
        display: none;
    }

    nav {
        justify-content: space-between !important;
        margin: 0px 2vw;
        height: 10vh;
    }

    .logo img {
        width: 7vw;
    }

    .logo h1 {
        font-size: 1em;
    }

    .fa-bars {
        display: block;
        font-size: 1.5em;
        color: #0D1023;
        text-shadow: 0.5px 0.5px 1px whitesmoke;
    }

    .linkTab {
        margin: 0px 0px;
        flex-direction: column;
        justify-content: space-around;
        position: absolute;
        top: 0px;
        left: 0px;
        background-color: black;
        height: 100vh;
        z-index: 10;
    }

    .fa-circle-xmark {
        font-size: 1.5em;
        color: white;
    }


    body {
        height: 100vh;
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
        backdrop-filter: grayscale(65%);
    }

    main section {
        width: 70vw;
    }

    .launchLogo {
        font-size: 0.6em;
        padding: 1vh 2vw;
    }

    .phoneHeading {
        font-size: 2em;
    }

    .phoneDetail {
        font-size: 0.8em;
    }

    #phoneFeature {
        display: none;
    }

    #videoBtn {
        display: none;
    }

    .price p {
        font-size: 0.9em;
    }

    .price h1 {
        color: white;
    }

    .orderButtons button {
        margin: 3vh 0px;
        padding: 1vh 2vw;
        border: none;
        background: black !important;
    }
}

@media(min-width:200px) and (max-width:400px) {
    body {
        background-position: -100vw;
    }
}


@media(min-width:600px) and (max-width:900px) {
    .linkTab {
        display: none;
    }

    nav {
        margin: 0px 2vw;
        justify-content: space-between !important;
    }

    .menuBars {
        display: none !important;
    }


    main section {
        width: 60vw;
    }

    .phoneHeading {
        font-size: 2.5em;
    }

    .phoneDetail {
        font-size: 1.2em;
    }

    #phoneFeature {
        display: none;
    }

    body {
        height: 100vh;
        background-size: cover;
    }
}
    </style>
</head>

<body>
    <!-- navbar  -->
    <nav class="flex-center">
        <div class="logo flex-center">
            <img src="logo.png" alt="N">
            <h1>NEXORA</h1>
        </div>

        <div class="linkTab flex-center" id="linkTab">
            <a href="#">Overview</a>
            <a href="#">Features</a>
            <a href="#">Design</a>
            <a href="#">Review</a>
            <a href="#">Contact</a>
        </div>

        <div class="orderBtn flex-center">
            <button>Pre-Order Now <i class="fa-solid fa-caret-right"></i></button>
        </div>

        <div class="menuBars" id="menuBars">
            <i class="fa-solid fa-bars" id="fa-bars" style="color: rgb(8, 0, 255);"></i>
            <i class="fa-solid fa-circle-xmark" id="fa-circle-xmark"></i>
        </div>
    </nav>

    <!-- main -->
    <main>
        <section>
            <button class="launchLogo"><i class="fa-regular fa-circle-dot" style="color: rgb(40, 0, 73);"></i> NEW
                LAUNCH</button>
            <h1 class="phoneHeading">NEXT LEVEL EXPERIENCE</h1>
            <p class="phoneDetail">Nexora is the new generation product,high performance,stunning design and intelligent
                feature for the
                future.</p>
            <div class="price">
                <p>Starting At</p>
                <h1>$199</h1>
            </div>

            <div class="orderButtons">
                <button>Pre-Order Now <i class="fa-solid fa-right-long"></i></button>
                <button id="videoBtn"><i class="fa-solid fa-circle-play"></i> Watch Video</button>
            </div>

            <div id="phoneFeature">
                <div class="phoneInfo">
                    <span><i class="fa-solid fa-camera"></i></span>
                    <div>
                        <h3>200MP</h3>
                        <h4>AI Camera</h4>
                    </div>
                </div>
                <div class="phoneInfo">
                    <span><i class="fa-solid fa-camera"></i></span>
                    <div>
                        <h3>200MP</h3>
                        <h4>AI Camera</h4>
                    </div>
                </div>
                <div class="phoneInfo">
                    <span><i class="fa-solid fa-camera"></i></span>
                    <div>
                        <h3>200MP</h3>
                        <h4>AI Camera</h4>
                    </div>
                </div>
            </div>
        </section>
    </main>







    <script>
        let menuBars = document.getElementById('menuBars');
        let menu = document.getElementById('fa-bars');
        let cross = document.getElementById('fa-circle-xmark');

        menuBars.addEventListener('click', () => {

            if (menu.style.display == "block") {
                let linkTab = document.getElementById('linkTab');
                linkTab.style.display = "flex";
                linkTab.style.width = "50vw";
                cross.style.display = "block";
                menu.style.display = "none";
            }
            else{
                let linkTab = document.getElementById('linkTab');
                linkTab.style.display = "none";
                cross.style.display = "none";
                menu.style.display = "block";
            }
        });

    </script>
</body>

</html>
